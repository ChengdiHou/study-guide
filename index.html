<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="课外课程目录与学习进度">
  <title>课外学习指南</title>
  <link rel="stylesheet" href="style.css">
  <script src="catalog.js" defer></script>
  <script src="progress.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#course-heading">跳到课程目录</a>
  <header class="hero">
    <div class="wrap hero-inner">
      <div>
        <p class="eyebrow"><span class="signal"></span> STUDY INDEX / 课外自学</p>
        <h1>课外学习指南</h1>
        <p class="intro">按目录学习，逐项勾选完成。下次打开，接着上次的进度。</p>
      </div>
      <div class="overview">
        <p class="eyebrow">总进度</p>
        <div class="overview-value" id="overall" aria-live="polite">—</div>
        <progress id="overall-bar" aria-label="总进度"></progress>
      </div>
    </div>
  </header>
  <main class="wrap layout">
    <aside class="shelf">
      <h2>课程列表</h2>
      <nav aria-label="课程列表" id="courses"></nav>
      <section class="backup" aria-label="进度备份">
        <p>进度保存在当前浏览器。换设备时，可以导出并导入备份。</p>
        <div class="backup-buttons">
          <button id="export" type="button">导出进度</button>
          <button id="import" type="button">导入进度</button>
          <input id="backup-file" type="file" accept=".json,application/json" hidden>
        </div>
        <p id="storage-message" role="status"></p>
      </section>
    </aside>
    <section class="content" aria-labelledby="course-heading">
      <header class="course-head">
        <p class="eyebrow" id="category"></p>
        <h2 id="course-heading" tabindex="-1"></h2>
        <p id="description"></p>
        <div id="links" class="links"></div>
        <div class="course-progress">
          <span id="course-count" aria-live="polite"></span>
          <progress id="course-bar" aria-label="当前课程进度"></progress>
        </div>
      </header>
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索标题、课次或日期" aria-label="搜索当前课程目录">
        <div class="filters" role="group" aria-label="按完成状态筛选">
          <button type="button" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-filter="todo" aria-pressed="false">待完成</button>
          <button type="button" data-filter="done" aria-pressed="false">已完成</button>
        </div>
      </div>
      <p class="empty" id="empty" hidden>没有符合条件的条目。</p>
      <div id="catalog"></div>
      <noscript><p class="empty">请启用 JavaScript，以查看课程目录和记录进度。</p></noscript>
    </section>
  </main>
</body>
</html>
